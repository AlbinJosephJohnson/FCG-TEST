<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Edit Employee Profile</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    *{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    :root{--purple:#3b0fff;--card-bg:#e5e8ff;--shadow:0 4px 4px rgba(0,0,0,.25);--border:#d2d5da;--label:#6d7280;--bg:#f8fafc}
    body{background:var(--bg);min-height:100vh;padding:16px}
    .header{display:flex;align-items:center;justify-content:center;height:64px;background:#fff;border-bottom:1px solid #e2e8f0;font-weight:600;font-size:18px;letter-spacing:.5px;color:#1e293b;margin-bottom:24px}
    .container{max-width:1400px;margin:0 auto;display:flex;gap:16px}
    .sidebar{width:72px;background:var(--purple);border-radius:12px;padding:20px 8px;display:flex;flex-direction:column;gap:12px;align-items:center;flex-shrink:0}
    .nav-item{width:40px;height:40px;background:rgba(255,255,255,.2);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;cursor:pointer;transition:all .2s}
    .nav-item:hover{background:rgba(255,255,255,.3)}
    .nav-spacer{flex:1}
    .content{display:flex;gap:24px;flex:1}
    .left-panel{background:var(--card-bg);border-radius:12px;box-shadow:var(--shadow);padding:32px 24px;flex:1.2;min-width:280px;position:relative}
    .back-arrow{position:absolute;top:24px;left:24px;display:flex;align-items:center;gap:8px;color:var(--purple);font-size:15px;font-weight:500;text-decoration:none;padding:10px 16px;border-radius:8px;background:rgba(59,15,255,.05);animation:bounce 2s infinite;transition:all .2s}
    .back-arrow:hover{background:rgba(59,15,255,.1)}
    @keyframes bounce{0%,20%,50%,80%,100%{transform:translateX(0)}40%{transform:translateX(-6px)}60%{transform:translateX(-3px)}}
    .profile-avatar{width:120px;height:120px;border-radius:50%;background:linear-gradient(135deg,var(--purple),#1e40af);margin:0 auto 20px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:32px;font-weight:700}
    .profile-name{font-size:22px;font-weight:600;color:#1e293b;text-align:center;margin-bottom:4px}
    .profile-id{font-size:15px;color:var(--label);text-align:center}
    .middle-panel{background:var(--card-bg);border-radius:12px;box-shadow:var(--shadow);padding:32px;flex:2.5;min-width:520px}
    .section-title{font-size:20px;font-weight:600;color:#1e293b;margin-bottom:24px}
    .form-row{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:24px}
    .form-group{margin-bottom:20px}
    label{display:block;font-size:14px;font-weight:500;color:var(--label);margin-bottom:8px}
    input,select{width:100%;padding:14px 16px;border:2px solid var(--border);border-radius:10px;font-size:16px;background:#fff;transition:border-color .2s}
    input:focus,select:focus{outline:none;border-color:var(--purple)}
    input:disabled{background:#f1f5f9;color:#94a3b8}
    .checkbox-row{display:flex;align-items:center;gap:12px;margin-bottom:16px}
    .phone-row{display:flex;gap:12px;align-items:end}
    .phone-row select{width:110px;flex-shrink:0}
    .password-row{display:flex;gap:12px;align-items:center}
    .copy-btn{padding:10px 16px;background:#f8fafc;border:1px solid var(--border);border-radius:8px;cursor:pointer;font-size:14px;display:flex;align-items:center;gap:6px;transition:all .2s}
    .copy-btn:hover{background:#e2e8f0}
    .copy-btn.copied{background:#10b981;color:#fff;border-color:#10b981}
    .right-panel{background:var(--card-bg);border-radius:12px;box-shadow:var(--shadow);padding:32px;flex:1;min-width:280px}
    .auth-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px 20px;margin-bottom:24px}
    .auth-item{display:flex;align-items:center;gap:8px;font-size:14px;color:#475569}
    .conditional{display:none;margin-top:16px;padding-top:20px;border-top:1px solid #e5e7eb}
    .conditional.show{display:block}
    .btn-full{width:100%;padding:16px;border:none;border-radius:10px;background:var(--purple);color:#fff;font-size:16px;font-weight:600;cursor:pointer;transition:background .2s}
    .btn-full:hover{background:#1e40af}
    #loadingOverlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:999}
    .spinner{width:48px;height:48px;border:4px solid #f3f3f3;border-top:4px solid var(--purple);border-radius:50%;animation:spin 1s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    #toastContainer{position:fixed;top:24px;right:24px;z-index:1000}
    .toast{background:#10b981;color:#fff;padding:16px 24px;border-radius:10px;margin-bottom:12px;transform:translateX(100%);animation:slideIn .4s forwards;font-weight:500}
    .toast.error{background:#ef4444}
    @keyframes slideIn{to{transform:translateX(0)}}
    @media(max-width:1024px){.content{flex-direction:column}.left-panel,.middle-panel,.right-panel{min-width:0}}
    @media(max-width:768px){.container{flex-direction:column;gap:16px}.form-row{grid-template-columns:1fr}.phone-row{flex-direction:column;align-items:stretch}.auth-grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <div id="loadingOverlay"><div class="spinner"></div></div>
  <div id="toastContainer"></div>
  
  <div class="header">EMPLOYEE MANAGEMENT</div>
  
  <div class="container">
    <nav class="sidebar" aria-label="Navigation">
      <div class="nav-item" title="Dashboard">📊</div>
      <div class="nav-item" title="Services">🔧</div>
      <div class="nav-item" title="Services Overview">📋</div>
      <div class="nav-item" title="Approvals">✅</div>
      <div class="nav-item" title="Manual Time Entry">⏱️</div>
      <div class="nav-item" title="Employee Management">👥</div>
      <div class="nav-item" title="Vehicle Management">🚗</div>
      <div class="nav-item" title="Settings">⚙️</div>
      <div class="nav-spacer"></div>
      <div class="nav-item" title="Profile">👤</div>
    </nav>

    <div class="content">
      <!-- LEFT: Profile -->
      <section class="left-panel">
        <a href="../currentUserId.html" class="back-arrow" aria-label="Back">← Back</a>
        <div id="profileAvatar" class="profile-avatar">JM</div>
        <div id="profileName" class="profile-name">Loading...</div>
        <div id="profileId" class="profile-id">Loading...</div>
      </section>

      <!-- MIDDLE: Form -->
      <section class="middle-panel">
        <h2 class="section-title">Profile View</h2>
        <form id="employeeForm">
          <div class="form-row">
            <div class="form-group">
              <label>Full Name <span style="color:#ef4444">*</span></label>
              <input type="text" id="fullName" required />
            </div>
            <div class="form-group">
              <label>Employee ID</label>
              <input type="text" id="employeeId" disabled />
            </div>
          </div>

          <div class="checkbox-row">
            <input type="checkbox" id="resetPassword" />
            <label for="resetPassword">Reset Password</label>
          </div>

          <div id="newPasswordSection" style="display:none">
            <label>New Password</label>
            <div class="password-row">
              <input type="text" id="newPassword" readonly />
              <button type="button" id="copyPasswordBtn" class="copy-btn">📋 Copy</button>
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label>Primary Contact Number <span style="color:#ef4444">*</span></label>
              <div class="phone-row">
                <select id="primaryCountryCode" required>
                  <option value="">+Country</option>
                  <option value="+971">+971</option>
                  <option value="+91">+91</option>
                </select>
                <input type="tel" id="primaryNumber" required />
              </div>
            </div>
            <div class="form-group">
              <label>Secondary Contact Number</label>
              <div class="phone-row">
                <select id="secondaryCountryCode">
                  <option value="">+Country</option>
                  <option value="+971">+971</option>
                  <option value="+91">+91</option>
                </select>
                <input type="tel" id="secondaryNumber" />
              </div>
            </div>
          </div>

          <button type="submit" class="btn-full">Save</button>
        </form>
      </section>

      <!-- RIGHT: Settings -->
      <section class="right-panel">
        <h2 class="section-title">Profile Settings & Privileges</h2>

        <div class="form-group">
          <label>Role <span style="color:#ef4444">*</span></label>
          <select id="role" required>
            <option value="">Select Role</option>
            <option value="Technician">Technician</option>
            <option value="Supervisor">Supervisor</option>
            <option value="Manager">Manager</option>
            <option value="Advisor">Advisor</option>
          </select>
        </div>

        <div class="form-group">
          <label>Authorization</label>
          <div class="auth-grid" id="authorizationGrid">
            <label class="auth-item"><input type="checkbox" value="Dashboard"> Dashboard</label>
            <label class="auth-item"><input type="checkbox" value="Services"> Services</label>
            <label class="auth-item"><input type="checkbox" value="Services Overview"> Services Overview</label>
            <label class="auth-item"><input type="checkbox" value="Approvals" disabled checked> Approvals</label>
            <label class="auth-item"><input type="checkbox" value="Manual Time Entry"> Manual Time Entry</label>
            <label class="auth-item"><input type="checkbox" value="Employee Management"> Employee Management</label>
            <label class="auth-item"><input type="checkbox" value="Vehicle Management"> Vehicle Management</label>
            <label class="auth-item"><input type="checkbox" value="Settings"> Settings</label>
          </div>
        </div>

        <div class="form-group">
          <label>Reports</label>
          <div style="display:grid;gap:12px">
            <label class="auth-item"><input type="checkbox" value="Vehicle Report"> Vehicle Report</label>
            <label class="auth-item"><input type="checkbox" value="Employee Report"> Employee Report</label>
          </div>
        </div>

        <div class="form-group">
          <label>Select Entry Page <span style="color:#ef4444">*</span></label>
          <select id="entryPage" required><option value="">Select...</option></select>
        </div>

        <div class="form-group">
          <label>Designation <span style="color:#ef4444">*</span></label>
          <select id="designation" required>
            <option value="">Select...</option>
            <option value="Technician">Technician</option>
            <option value="Supervisor">Supervisor</option>
            <option value="Manager">Manager</option>
            <option value="Foreman">Foreman</option>
            <option value="Other">Other</option>
          </select>
          <div id="designationOtherSection" class="conditional">
            <input type="text" id="designationOther" placeholder="Add Designation" />
          </div>
        </div>

        <div class="form-group">
          <label>Employee Type <span style="color:#ef4444">*</span></label>
          <select id="employeeType" required>
            <option value="">Select...</option>
            <option value="Permanent">Permanent</option>
            <option value="Contract">Contract</option>
            <option value="Temporary">Temporary</option>
          </select>
          <div id="companySection" class="conditional">
            <label>Company <span style="color:#ef4444">*</span></label>
            <select id="company">
              <option value="">Select Company</option>
              <option value="ABC Motors">ABC Motors</option>
              <option value="XYZ Auto">XYZ Auto</option>
              <option value="Premium Cars">Premium Cars</option>
              <option value="Elite Service">Elite Service</option>
              <option value="Other">Other</option>
            </select>
            <div id="companyOtherSection" class="conditional">
              <input type="text" id="companyOther" placeholder="Add Company" />
            </div>
          </div>
        </div>
      </section>
    </div>
  </div>

  <script>
    // SAME JAVASCRIPT AS BEFORE - just paste the full script from previous response
    (function(){const qs=sel=>document.querySelector(sel),qsa=sel=>[...document.querySelectorAll(sel)];let currentEmployee=null;function showToast(msg,type='success'){const t=document.createElement('div');t.className=`toast ${type}`;t.textContent=msg;qs('#toastContainer').appendChild(t);setTimeout(()=>t.remove(),4e3)}function navigateTo(url){window.location.href=url}function generateRandomNumber(){return(1e5+900000*Math.random()).toString()}function loadEmployee(){const u=new URLSearchParams(location.search),id=u.get('userId')||'EMP010';try{const e=JSON.parse(localStorage.getItem('employees')||'[]');currentEmployee=e.find(e=>e.id===id||e.employeeId===id);if(!currentEmployee){showToast('Employee not found','error');setTimeout(()=>navigateTo('../currentUserId.html'),1500);return}populateForm();qs('#loadingOverlay').style.display='none'}catch(e){showToast('Error loading data','error');qs('#loadingOverlay').style.display='none'}}function populateForm(){const e=currentEmployee;qs('#profileAvatar').textContent=e.fullName.slice(0,2).toUpperCase();qs('#profileName').textContent=e.fullName;qs('#profileId').textContent=e.employeeId;qs('#fullName').value=e.fullName;qs('#employeeId').value=e.employeeId;if(e.primaryContact){const[c,n]=e.primaryContact.split('-');qs('#primaryCountryCode').value=c||'+971';qs('#primaryNumber').value=n||''}if(e.secondaryContact){const[c,n]=e.secondaryContact.split('-');qs('#secondaryCountryCode').value=c||'';qs('#secondaryNumber').value=n||''}qs('#role').value=e.role||'';updateCheckboxes();qs('#entryPage').value=e.entryPage||'';qs('#designation').value=e.designation||'';qs('#employeeType').value=e.employeeType||'';if(e.company)qs('#company').value=e.company;toggleRoleAuthorizations();toggleDesignationOther();toggleCompanySection();updateEntryPageOptions()}function updateCheckboxes(){qsa('input[type="checkbox"]').forEach(c=>c.checked=!1);(currentEmployee.authorizations||[]).forEach(v=>{const c=qs(`input[value="${v}"]`);c&&(c.checked=!0)});(currentEmployee.reports||[]).forEach(v=>{const c=qs(`input[value="${v}"]`);c&&(c.checked=!0)})}document.addEventListener('DOMContentLoaded',()=>{attachEvents();loadEmployee()});function attachEvents(){qs('#resetPassword').addEventListener('change',function(){const s=qs('#newPasswordSection');if(this.checked){const r=generateRandomNumber(),p=`${r}_${currentEmployee.employeeId}`;qs('#newPassword').value=p;s.style.display='block'}else s.style.display='none'});qs('#copyPasswordBtn').addEventListener('click',handleCopyPassword);qs('#employeeForm').addEventListener('submit',e=>{e.preventDefault();saveEmployee()});qs('#role').addEventListener('change',toggleRoleAuthorizations);qs('#designation').addEventListener('change',toggleDesignationOther);qs('#employeeType').addEventListener('change',toggleCompanySection);qs('#company').addEventListener('change',toggleCompanyOther);qs('#authorizationGrid').addEventListener('change',updateEntryPageOptions)}function handleCopyPassword(){navigator.clipboard.writeText(qs('#newPassword').value).then(()=>{const b=qs('#copyPasswordBtn');b.innerHTML='✅ Copied!';b.classList.add('copied');setTimeout(()=>{b.innerHTML='📋 Copy';b.classList.remove('copied')},5e3)})}function toggleRoleAuthorizations(){const r=qs('#role').value,m=['Manager','Advisor'];['Dashboard','Services','Services Overview','Approvals'].forEach(a=>{const c=qs(`input[value="${a}"]`);c.disabled=m.includes(r)})}function toggleDesignationOther(){qs('#designationOtherSection').classList.toggle('show',qs('#designation').value==='Other')}function toggleCompanySection(){const v=qs('#employeeType').value;qs('#companySection').classList.toggle('show',v==='Contract')}function toggleCompanyOther(){qs('#companyOtherSection').classList.toggle('show',qs('#company').value==='Other')}function updateEntryPageOptions(){const s=qs('#entryPage');s.innerHTML='<option value="">Select...</option>';qsa('#authorizationGrid input:checked').forEach(c=>{if(c.value!=='Approvals'){const o=document.createElement('option');o.value=o.textContent=c.value;s.appendChild(o)}})}function validateForm(){const req=['fullName','role','entryPage','designation','employeeType','primaryCountryCode','primaryNumber'],p=qs('#primaryNumber');if(p.value.length<9||p.value.length>15){showToast('Phone must be 9-15 digits','error');return!1}if(qs('#employeeType').value==='Contract'&&!qs('#company').value){showToast('Company required for Contract','error');return!1}if(qs('#designation').value==='Other'&&!qs('#designationOther').value.trim()){showToast('Designation required','error');return!1}if(qs('#company').value==='Other'&&!qs('#companyOther').value.trim()){showToast('Company required','error');return!1}return req.every(id=>qs(`#${id}`).value.trim())}function saveEmployee(){if(!validateForm())return;try{const e=JSON.parse(localStorage.getItem('employees')||'[]'),i=e.findIndex(e=>e.id===currentEmployee.id);e[i]={...currentEmployee,fullName:qs('#fullName').value.trim(),primaryContact:`${qs('#primaryCountryCode').value}-${qs('#primaryNumber').value}`,secondaryContact:qs('#secondaryCountryCode').value?`${qs('#secondaryCountryCode').value}-${qs('#secondaryNumber').value}`:'',role:qs('#role').value,authorizations:qsa('#authorizationGrid input:checked').map(c=>c.value),reports:qsa('input[value*="Report"]:checked').map(c=>c.value),entryPage:qs('#entryPage').value,designation:qs('#designation').value==='Other'?qs('#designationOther').value.trim():qs('#designation').value,employeeType:qs('#employeeType').value,company:qs('#company').value==='Other'?qs('#companyOther').value.trim():qs('#company').value,...qs('#resetPassword').checked&&{password:qs('#newPassword').value}};localStorage.setItem('employees',JSON.stringify(e));showToast('Employee updated successfully');setTimeout(()=>navigateTo('../currentUserId.html'),1500)}catch(e){showToast('Save error','error')}}})();
  </script>
</body>
</html>
